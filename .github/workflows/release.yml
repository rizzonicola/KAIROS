name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach artifacts to
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  RUST_TOOLCHAIN: "1.85.0"
  WASM_BINDGEN_VERSION: "0.2.100"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_TOOLCHAIN}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
          sudo apt-get update && sudo apt-get install -y binaryen
      - name: Rust tests
        run: cd kairos-core && cargo test --release
      - name: Core and pinned Stockfish Lite (hash must be pinned in scripts/engine.lock)
        run: |
          ./scripts/build_core.sh
          KAIROS_REQUIRE_PIN=1 ./scripts/fetch_engine.sh
      - name: Web dependencies and tests
        env:
          KAIROS_ENGINE: ${{ github.workspace }}/web/public/engine/stockfish-19-lite-single.js
        run: cd web && npm ci && npm test
      - name: Package the UCI engine and the web page
        run: |
          ./scripts/build_uci.sh "${TAG}"
          ./scripts/build_web.sh "${TAG}"
          cd dist && sha256sum kairos-uci-*.tar.gz kairos-web-*.tar.gz > SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/kairos-uci-*.tar.gz dist/kairos-web-*.tar.gz dist/SHA256SUMS --clobber
